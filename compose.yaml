services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: miniledger
      POSTGRES_PASSWORD: miniledger_dev_password
      POSTGRES_DB: miniledger
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniledger -d miniledger"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  postgres_data:
