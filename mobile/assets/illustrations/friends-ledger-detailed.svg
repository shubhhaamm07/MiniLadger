<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">MiniLedger: a loan between friends</title>
  <desc id="desc">Two friends exchange a rupee note across a table. A calendar, ledger, coins, and repayment check show the life of a loan.</desc>
